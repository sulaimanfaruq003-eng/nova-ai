
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d1b">
<title>NOVA AI — Your AI. Your World.</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080d1b;
  --panel:#10182b;
  --panel2:#17223a;
  --blue:#3985ff;
  --text:#f3f6ff;
  --muted:#94a3bd;
  --border:rgba(255,255,255,.09);
}
body{
  font-family:Inter,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  height:100dvh;
  overflow:hidden;
}
button{font:inherit;cursor:pointer}
.app{height:100dvh;display:flex;overflow:hidden}

/* SIDEBAR */
.sidebar{
  width:270px;
  background:#0c1425;
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  padding:20px 14px;
  flex-shrink:0;
  transition:transform .28s ease;
  z-index:20;
}
.logo{
  display:flex;align-items:center;gap:11px;
  padding:5px 8px 25px;
}
.logo-mark{
  width:38px;height:38px;border-radius:12px;
  background:linear-gradient(135deg,#3985ff,#1550cf);
  display:grid;place-items:center;
  font-size:23px;font-weight:800;
  box-shadow:0 0 22px #3985ff55;
}
.logo-name{font-size:20px;font-weight:800;letter-spacing:1px}
.logo-name span{color:var(--blue)}
.new-chat{
  background:var(--blue);color:white;border:0;
  border-radius:12px;padding:13px;
  font-weight:700;width:100%;margin-bottom:25px;
}
.new-chat:hover{background:#246de0}
.section-label{
  color:var(--muted);font-size:11px;
  text-transform:uppercase;letter-spacing:1.5px;
  padding:0 10px 12px;
}
.history{overflow-y:auto;flex:1}
.history-item{
  padding:12px 11px;border-radius:9px;
  color:#c4cee1;font-size:13px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  cursor:pointer;margin-bottom:4px;
}
.history-item:hover{background:var(--panel2)}
.sidebar-bottom{
  border-top:1px solid var(--border);
  padding-top:15px;color:var(--muted);
  font-size:13px;
}
.sidebar-bottom div{padding:10px;border-radius:8px}

/* MAIN */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.header{
  height:65px;flex-shrink:0;
  display:flex;align-items:center;gap:14px;
  padding:0 20px;border-bottom:1px solid var(--border);
}
.menu-btn{
  border:0;background:transparent;color:white;
  font-size:24px;padding:5px 8px;border-radius:8px;
}
.menu-btn:hover{background:var(--panel2)}
.header-title{font-weight:650;font-size:15px}
.header-sub{font-size:11px;color:var(--muted);margin-top:3px}
.online-dot{
  width:7px;height:7px;border-radius:50%;
  background:#42d99a;display:inline-block;margin-right:5px;
}
.chat-area{
  flex:1;overflow-y:auto;padding:35px 20px 20px;
  scroll-behavior:smooth;
}
.welcome{
  max-width:650px;margin:10vh auto 35px;text-align:center;
}
.welcome-logo{
  width:65px;height:65px;border-radius:21px;
  display:grid;place-items:center;margin:0 auto 20px;
  font-size:35px;font-weight:800;
  background:linear-gradient(135deg,#3985ff,#1649b8);
  box-shadow:0 0 35px #3985ff44;
}
.welcome h1{font-size:29px;margin-bottom:10px}
.welcome h1 span{color:var(--blue)}
.welcome p{color:var(--muted);font-size:14px;line-height:1.6}
.suggestions{
  display:flex;flex-wrap:wrap;gap:10px;
  justify-content:center;margin-top:25px;
}
.suggestion{
  background:var(--panel);border:1px solid var(--border);
  color:#dce6fa;padding:11px 14px;border-radius:12px;
  font-size:12px;
}
.suggestion:hover{border-color:var(--blue)}
.messages{max-width:800px;margin:auto}
.message{
  display:flex;margin:22px 0;gap:11px;
  align-items:flex-start;
}
.message.user{justify-content:flex-end}
.avatar{
  width:30px;height:30px;flex-shrink:0;
  border-radius:10px;background:var(--blue);
  display:grid;place-items:center;font-weight:800;
  font-size:14px;
}
.bubble{
  max-width:min(78%,620px);
  padding:13px 16px;border-radius:15px;
  font-size:14px;line-height:1.65;
  overflow-wrap:anywhere;
}
.assistant .bubble{
  background:var(--panel);border:1px solid var(--border);
  border-top-left-radius:4px;
}
.user .bubble{
  background:#174d9e;border-top-right-radius:4px;
}
.bubble img{max-width:220px;max-height:220px;border-radius:10px;display:block;margin-bottom:8px}
.thinking{color:var(--muted);font-size:13px}
.dots span{animation:pulse 1.2s infinite;display:inline-block}
.dots span:nth-child(2){animation-delay:.2s}
.dots span:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* COMPOSER */
.composer-wrap{
  padding:12px 20px 20px;
  background:linear-gradient(transparent,var(--bg) 20%);
  flex-shrink:0;
}
.composer{
  max-width:800px;margin:auto;
  background:var(--panel);border:1px solid #263653;
  border-radius:17px;padding:12px;
  box-shadow:0 8px 35px #0003;
}
.composer textarea{
  width:100%;resize:none;outline:none;border:0;
  background:transparent;color:white;
  font:14px Arial;min-height:35px;max-height:120px;
  padding:7px;line-height:1.5;
}
.composer textarea::placeholder{color:#8190aa}
.composer-bottom{
  display:flex;align-items:center;justify-content:space-between;
  padding-top:7px;
}
.tools{display:flex;gap:8px}
.tool-btn{
  background:transparent;color:var(--muted);
  border:0;border-radius:9px;padding:8px 10px;font-size:18px;
}
.tool-btn:hover{background:var(--panel2);color:white}
.send-btn{
  background:var(--blue);border:0;color:white;
  border-radius:10px;padding:9px 17px;font-weight:700;
}
.send-btn:hover{background:#246de0}
.preview{
  display:none;align-items:center;gap:10px;
  padding:8px;margin-bottom:8px;
  background:var(--panel2);border-radius:10px;
  font-size:12px;color:var(--muted);
}
.preview img{width:48px;height:48px;object-fit:cover;border-radius:7px}
.remove-image{
  background:transparent;color:#ff8c8c;border:0;margin-left:auto;
  padding:8px;
}
.footer-note{
  text-align:center;color:#64718b;font-size:10px;
  margin-top:10px;
}

/* MOBILE SIDEBAR */
.overlay{
  position:fixed;inset:0;background:#0009;
  opacity:0;visibility:hidden;
  transition:opacity .28s,visibility .28s;
  z-index:15;
}
.overlay.show{opacity:1;visibility:visible}

@media(max-width:700px){
  .sidebar{
    position:fixed;left:0;top:0;bottom:0;
    height:100dvh;width:min(290px,82vw);
    transform:translateX(-105%);
    box-shadow:15px 0 45px #0005;
  }
  .sidebar.open{transform:translateX(0)}
  .header{padding:0 12px}
  .chat-area{padding:20px 13px}
  .welcome{margin:9vh auto 30px}
  .welcome h1{font-size:25px}
  .composer-wrap{padding:10px 10px 14px}
  .bubble{max-width:85%}
}
</style>
</head>

<body>
<div class="app">

  <aside class="sidebar" id="sidebar">
    <div class="logo">
      <div class="logo-mark">N</div>
      <div class="logo-name">NOVA <span>AI</span></div>
    </div>

    <button class="new-chat" onclick="newChat()">＋ New Chat</button>

    <div class="section-label">Recent Chats</div>
    <div class="history" id="history"></div>

    <div class="sidebar-bottom">
      <div>⚙️ Settings</div>
      <div>👤 Account</div>
      <div style="color:#8190aa">Your AI. Your World.</div>
    </div>
  </aside>

  <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

  <main class="main">
    <header class="header">
      <button class="menu-btn" onclick="toggleSidebar()" aria-label="Open menu">☰</button>
      <div>
        <div class="header-title">NOVA AI</div>
        <div class="header-sub"><span class="online-dot"></span>Your AI assistant</div>
      </div>
    </header>

    <section class="chat-area" id="chatArea">
      <div class="welcome" id="welcome">
        <div class="welcome-logo">N</div>
        <h1>What can I help <span>you with?</span></h1>
        <p>Welcome to NOVA AI. Ask questions, explore ideas and discover what's possible.</p>
        <div class="suggestions">
          <button class="suggestion" onclick="useSuggestion('Explain something to me step by step')">📚 Learn something</button>
          <button class="suggestion" onclick="useSuggestion('Help me write something creative')">✍️ Write something</button>
          <button class="suggestion" onclick="useSuggestion('Help me understand a difficult problem')">💡 Solve a problem</button>
          <button class="suggestion" onclick="useSuggestion('Give me some creative ideas')">✨ Get ideas</button>
        </div>
      </div>
      <div class="messages" id="messages"></div>
    </section>

    <div class="composer-wrap">
      <div class="composer">
        <div class="preview" id="preview">
          <img id="previewImage" alt="Image preview">
          <span id="previewName"></span>
          <button class="remove-image" onclick="removeImage()">✕ Remove</button>
        </div>

        <textarea id="messageInput" rows="1" placeholder="Message NOVA AI..." onkeydown="handleKey(event)"></textarea>

        <div class="composer-bottom">
          <div class="tools">
            <button class="tool-btn" onclick="document.getElementById('imageInput').click()" title="Attach image">＋</button>
            <input type="file" id="imageInput" accept="image/*" hidden onchange="selectImage(event)">
            <button class="tool-btn" title="Voice input" onclick="voiceNotice()">🎙️</button>
          </div>
          <button class="send-btn" onclick="sendMessage()">Send ↑</button>
        </div>
      </div>
      <div class="footer-note">NOVA AI can make mistakes. Check important information.</div>
    </div>
  </main>
</div>

<script>
const sidebar=document.getElementById('sidebar');
const overlay=document.getElementById('overlay');
const chatArea=document.getElementById('chatArea');
const messages=document.getElementById('messages');
const welcome=document.getElementById('welcome');
const input=document.getElementById('messageInput');

let selectedFile=null;
let chats=[];
let activeChat=[];

function isMobile(){
  return window.matchMedia('(max-width:700px)').matches;
}

function openSidebar(){
  if(!isMobile()) return;
  sidebar.classList.add('open');
  overlay.classList.add('show');
}

function closeSidebar(){
  sidebar.classList.remove('open');
  overlay.classList.remove('show');
}

function toggleSidebar(){
  if(sidebar.classList.contains('open')) closeSidebar();
  else openSidebar();
}

/* SWIPE GESTURES */
let startX=0;
let startY=0;
let tracking=false;

document.addEventListener('touchstart',function(e){
  if(!isMobile()) return;
  const touch=e.touches[0];
  startX=touch.clientX;
  startY=touch.clientY;

  const sidebarOpen=sidebar.classList.contains('open');
  tracking=sidebarOpen || startX<35;
},{passive:true});

document.addEventListener('touchend',function(e){
  if(!isMobile() || !tracking) return;

  const touch=e.changedTouches[0];
  const deltaX=touch.clientX-startX;
  const deltaY=touch.clientY-startY;

  tracking=false;

  if(Math.abs(deltaX)<65 || Math.abs(deltaX)<Math.abs(deltaY)*1.3) return;

  if(deltaX<0 && sidebar.classList.contains('open')){
    closeSidebar();
  }else if(deltaX>0 && !sidebar.classList.contains('open') && startX<45){
    openSidebar();
  }
},{passive:true});

window.addEventListener('resize',function(){
  if(!isMobile()) closeSidebar();
});

function newChat(){
  if(activeChat.length){
    chats.unshift({
      title:activeChat[0].text.slice(0,35) || 'Image conversation',
      messages:activeChat
    });
  }
  activeChat=[];
  messages.innerHTML='';
  welcome.style.display='block';
  input.value='';
  removeImage();
  renderHistory();
  closeSidebar();
}

function renderHistory(){
  const history=document.getElementById('history');
  history.innerHTML='';

  chats.forEach((chat,index)=>{
    const item=document.createElement('div');
    item.className='history-item';
    item.textContent='💬 '+chat.title;
    item.onclick=()=>loadChat(index);
    history.appendChild(item);
  });
}

function loadChat(index){
  activeChat=chats[index].messages.map(m=>({...m}));
  messages.innerHTML='';
  welcome.style.display='none';

  activeChat.forEach(m=>addMessage(m.role,m.text,null,m.image));
  closeSidebar();
}

function useSuggestion(text){
  input.value=text;
  sendMessage();
}

function selectImage(event){
  const file=event.target.files[0];
  if(!file) return;

  if(!file.type.startsWith('image/')){
    alert('Please select an image file.');
    return;
  }

  selectedFile=file;
  document.getElementById('previewImage').src=URL.createObjectURL(file);
  document.getElementById('previewName').textContent=file.name;
  document.getElementById('preview').style.display='flex';
}

function removeImage(){
  selectedFile=null;
  document.getElementById('preview').style.display='none';
  document.getElementById('imageInput').value='';
}

function addMessage(role,text,imageUrl=null){
  const row=document.createElement('div');
  row.className='message '+(role==='user'?'user':'assistant');

  if(role==='assistant'){
    const avatar=document.createElement('div');
    avatar.className='avatar';
    avatar.textContent='N';
    row.appendChild(avatar);
  }

  const bubble=document.createElement('div');
  bubble.className='bubble';

  if(imageUrl){
    const img=document.createElement('img');
    img.src=imageUrl;
    img.alt='Attached image';
    bubble.appendChild(img);
  }

  const content=document.createElement('div');
  content.textContent=text;
  bubble.appendChild(content);
  row.appendChild(bubble);

  messages.appendChild(row);
  chatArea.scrollTop=chatArea.scrollHeight;
  return row;
}

function sendMessage(){
  const text=input.value.trim();
  if(!text && !selectedFile) return;

  welcome.style.display='none';

  let imageUrl=null;
  if(selectedFile) imageUrl=URL.createObjectURL(selectedFile);

  addMessage('user',text,imageUrl);
  activeChat.push({role:'user',text:text,image:imageUrl});

  input.value='';
  removeImage();

  const thinking=addMessage('assistant','');
  thinking.querySelector('.bubble').innerHTML=
    '<div class="thinking">NOVA is thinking <span class="dots"><span>.</span><span>.</span><span>.</span></span></div>';

  setTimeout(()=>{
    thinking.querySelector('.bubble').textContent=
      'Thanks for your message! NOVA AI is currently a demonstration version. Its real AI connection has not been activated yet.';
    activeChat.push({
      role:'assistant',
      text:'Thanks for your message! NOVA AI is currently a demonstration version. Its real AI connection has not been activated yet.'
    });
    chatArea.scrollTop=chatArea.scrollHeight;
    renderHistory();
  },1200);
}

function handleKey(event){
  if(event.key==='Enter' && !event.shiftKey){
    event.preventDefault();
    sendMessage();
  }
}

function voiceNotice(){
  alert('Voice input is not activated yet. We will add it in a future update.');
}

renderHistory();
</script>
</body>
</html>
