
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080e1d">
<title>NOVA AI</title>
<style>
:root{--bg:#080e1d;--panel:#101a2d;--panel2:#192943;--text:#f3f6ff;--muted:#93a2bb;--blue:#3985ff;--border:#25334b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
button,textarea,input{font:inherit}button{cursor:pointer}
.app{display:flex;height:100dvh;overflow:hidden}
.sidebar{width:270px;background:#0b1425;border-right:1px solid var(--border);padding:17px;display:flex;flex-direction:column;flex-shrink:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:800;margin:5px 0 25px}
.logo{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#1677ff,#64c4ff);display:grid;place-items:center;color:white;font-size:22px;font-weight:900}
.newchat{background:var(--blue);border:0;color:white;padding:13px;border-radius:12px;font-weight:700}
.sideheading{font-size:12px;color:var(--muted);margin:25px 5px 10px}
.searchbox{width:100%;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:11px 12px;color:white;outline:none;margin-bottom:12px;font-size:13px}
.searchbox:focus{border-color:var(--blue)}
.searchbox::placeholder{color:#8192ad}
.chatlist{overflow:auto;flex:1}
.chatrow{display:flex;align-items:center;gap:4px;margin-bottom:5px}
.chatitem{flex:1;min-width:0;padding:11px;border-radius:9px;color:#cbd6e9;cursor:pointer;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chatitem:hover,.chatitem.active{background:var(--panel2)}
.chatmore{background:transparent;border:0;color:#aabbd3;font-size:19px;padding:7px;border-radius:8px}
.chatmore:hover{background:var(--panel2)}
.no-results{color:var(--muted);font-size:13px;padding:12px 8px;line-height:1.5}
.sidebottom{border-top:1px solid var(--border);padding-top:12px;color:var(--muted);font-size:13px;display:grid;gap:8px}
.sideaction{background:var(--panel);border:1px solid var(--border);color:#dce7fb;padding:10px;border-radius:9px;text-align:left}
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.topbar{height:60px;display:flex;align-items:center;padding:0 17px;border-bottom:1px solid var(--border);gap:13px;flex-shrink:0}
.menu{background:none;border:0;color:white;font-size:23px}
.topname{font-weight:700}.status{margin-left:auto;color:#7e9bc4;font-size:12px}
.messages{flex:1;overflow-y:auto;padding:25px 18px 30px}
.welcome{max-width:720px;margin:13vh auto 0;text-align:center}
.welcome h1{font-size:32px;margin-bottom:10px}.welcome p{color:var(--muted)}
.suggestions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:28px}
.suggestions button{background:var(--panel);border:1px solid var(--border);color:#dce7fb;padding:11px 14px;border-radius:12px}
.message{max-width:850px;margin:0 auto 25px;display:flex;gap:12px;align-items:flex-start}
.message.user{flex-direction:row-reverse}
.avatar{width:31px;height:31px;border-radius:10px;background:var(--panel2);display:grid;place-items:center;flex-shrink:0;font-size:14px}
.message.assistant .avatar{background:#174b9a}
.bubble{max-width:min(100%,720px);padding:13px 16px;border-radius:15px;background:var(--panel);line-height:1.65;overflow-wrap:anywhere}
.message.user .bubble{background:#173c70}
.message-content p{margin:0 0 12px}.message-content p:last-child{margin-bottom:0}
.message-content h1,.message-content h2,.message-content h3{line-height:1.3;margin:18px 0 9px}
.message-content h1{font-size:1.5em}.message-content h2{font-size:1.3em}.message-content h3{font-size:1.12em}
.message-content ul,.message-content ol{padding-left:24px}
.message-content li{margin:5px 0}
.message-content blockquote{border-left:3px solid var(--blue);margin:12px 0;padding:5px 12px;color:#bdcce3}
.message-content a{color:#79b4ff}
.message-content code{background:#081120;padding:2px 5px;border-radius:5px;font-size:.9em}
.codebox{background:#070d18;border:1px solid var(--border);border-radius:10px;margin:12px 0;overflow:hidden}
.codehead{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;color:var(--muted);font-size:12px;border-bottom:1px solid var(--border)}
.codehead button{background:#1b2a42;border:0;color:white;padding:5px 9px;border-radius:6px}
.codebox pre{padding:13px;margin:0;overflow-x:auto;white-space:pre}
.message-content table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.message-content th,.message-content td{border:1px solid #34435b;padding:8px;text-align:left}
.message-content th{background:#1b2a42}
.composer-area{padding:12px 16px 18px;background:linear-gradient(transparent,var(--bg) 20%);flex-shrink:0}
.composer{max-width:850px;margin:auto;background:var(--panel);border:1px solid #34445f;border-radius:17px;padding:10px;display:flex;align-items:flex-end;gap:8px}
.composer textarea{flex:1;resize:none;max-height:150px;min-height:40px;background:transparent;border:0;outline:0;color:white;padding:10px}
.toolbtn{background:var(--panel2);border:0;color:white;border-radius:10px;padding:10px;font-size:18px}
.sendbtn{background:var(--blue);border:0;color:white;border-radius:10px;padding:11px 15px;font-weight:700}
.disclaimer{text-align:center;color:#71829c;font-size:11px;margin-top:9px}
.attachmenu{display:none;position:absolute;bottom:95px;left:18px;background:#17243a;border:1px solid var(--border);padding:7px;border-radius:12px;z-index:30;box-shadow:0 8px 30px #0008}
.attachmenu.show{display:grid;gap:5px}
.attachmenu button{background:none;border:0;color:white;text-align:left;padding:11px;border-radius:8px}
.attachmenu button:hover{background:#263956}
.preview{max-width:850px;margin:0 auto 8px;display:none;background:var(--panel);padding:9px;border-radius:10px;color:#cbd6e9;font-size:13px}
.preview img{max-width:90px;max-height:75px;object-fit:cover;border-radius:7px;vertical-align:middle;margin-right:8px}
.thinking{color:#9bb9e8;font-size:13px}
.dots span{animation:blink 1.2s infinite;opacity:.2}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:1}}
.message-menu{display:none;position:fixed;z-index:1000;background:#192943;border:1px solid #405574;border-radius:12px;padding:6px;min-width:165px;box-shadow:0 12px 35px #0009}
.message-menu.show{display:grid}
.message-menu button{border:0;background:transparent;color:white;text-align:left;padding:11px;border-radius:8px;font-size:14px}
.message-menu button:hover{background:#2a4162}
.chat-actions{display:none;position:fixed;z-index:1001;background:#192943;border:1px solid #405574;border-radius:12px;padding:6px;min-width:175px;box-shadow:0 12px 35px #0009}
.chat-actions.show{display:grid}
.chat-actions button{border:0;background:transparent;color:white;text-align:left;padding:11px;border-radius:8px;font-size:14px}
.chat-actions button:hover{background:#2a4162}
.toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);background:#203450;color:white;padding:10px 16px;border-radius:20px;font-size:13px;z-index:1100;display:none}
.overlay{display:none}
@media(max-width:700px){
.sidebar{position:absolute;top:0;bottom:0;left:0;transform:translateX(-105%);transition:transform .25s;box-shadow:10px 0 30px #0008}
.sidebar.open{transform:translateX(0)}
.overlay.show{display:block;position:absolute;inset:0;background:#0008;z-index:15}
.messages{padding:20px 12px}.welcome{margin-top:12vh}
.welcome h1{font-size:27px}.composer-area{padding:9px 10px 13px}
}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
 <div class="brand"><div class="logo">N</div>NOVA AI</div>
 <button class="newchat" id="newChat">＋ New Chat</button>
 <div class="sideheading">RECENT CHATS</div>
 <input class="searchbox" id="chatSearch" type="search" placeholder="🔍 Search conversations..." autocomplete="off">
 <div class="chatlist" id="chatList"></div>
 <div class="sidebottom">
  <button class="sideaction" id="exportAll">📤 Export all chats</button>
  <button class="sideaction" id="clearAll">🗑️ Clear all chats</button>
  <div>NOVA AI · Your AI. Your World.</div>
 </div>
</aside>
<div class="overlay" id="overlay"></div>
<main class="main">
 <header class="topbar">
  <button class="menu" id="menuBtn">☰</button>
  <div class="topname">NOVA AI</div>
  <div class="status">Demo mode</div>
 </header>
 <section class="messages" id="messages">
  <div class="welcome">
   <div class="logo" style="margin:auto;width:55px;height:55px;font-size:30px">N</div>
   <h1>What can I help you with?</h1><p>Your AI. Your World.</p>
   <div class="suggestions">
    <button data-prompt="Explain something in a simple way">Explain something</button>
    <button data-prompt="Help me write something">Help me write</button>
    <button data-prompt="Give me creative ideas">Creative ideas</button>
   </div>
  </div>
 </section>
 <div class="composer-area">
  <div class="preview" id="preview"></div>
  <div class="composer">
   <button class="toolbtn" id="attachBtn" title="Attach">＋</button>
   <textarea id="input" rows="1" placeholder="Message NOVA AI..."></textarea>
   <button class="toolbtn" id="micBtn" title="Voice typing">🎙</button>
   <button class="sendbtn" id="sendBtn">Send ↑</button>
  </div>
  <div class="disclaimer">NOVA AI can make mistakes. Check important information.</div>
 </div>
 <div class="attachmenu" id="attachMenu">
  <button id="cameraBtn">📷 Camera</button>
  <button id="photoBtn">🖼 Photos</button>
  <button id="fileBtn">📁 Files</button>
 </div>
</main>
</div>
<div class="message-menu" id="messageMenu"></div>
<div class="chat-actions" id="chatActions"></div>
<div class="toast" id="toast"></div>
<input hidden type="file" id="cameraInput" accept="image/*" capture="environment">
<input hidden type="file" id="photoInput" accept="image/*">
<input hidden type="file" id="fileInput" accept="image/*,.pdf,.doc,.docx,.txt,.csv,.xls,.xlsx,.ppt,.pptx">

<script>
const $=id=>document.getElementById(id);
const messages=$('messages'),input=$('input');
const STORAGE_KEY='nova_ai_saved_chats_v1';

let chats=[];
let currentChat=null;
let attachment=null;
let thinking=false;
let holdTimer=null,menuIndex=null,toastTimer=null;
let selectedChatId=null;

function saveChats(){
 try{
  localStorage.setItem(STORAGE_KEY,JSON.stringify({
   chats:chats,
   currentChatId:currentChat?currentChat.id:null
  }));
 }catch(error){console.warn('NOVA could not save chats:',error)}
}

function loadChats(){
 try{
  const saved=localStorage.getItem(STORAGE_KEY);
  if(!saved)return false;
  const data=JSON.parse(saved);
  if(!data||!Array.isArray(data.chats))return false;
  chats=data.chats.filter(chat=>chat&&Array.isArray(chat.items));
  currentChat=chats.find(chat=>String(chat.id)===String(data.currentChatId))||chats[0]||null;
  return chats.length>0;
 }catch(error){chats=[];currentChat=null;return false}
}

function newChat(){
 currentChat={id:Date.now(),title:'New chat',items:[]};
 chats.unshift(currentChat);
 saveChats();
 renderChatList();
 showWelcome();
 closeSidebar();
}

function showWelcome(){
 messages.innerHTML='';
 const w=document.createElement('div');
 w.className='welcome';
 w.innerHTML='<div class="logo" style="margin:auto;width:55px;height:55px;font-size:30px">N</div><h1>What can I help you with?</h1><p>Your AI. Your World.</p><div class="suggestions"><button data-prompt="Explain something in a simple way">Explain something</button><button data-prompt="Help me write something">Help me write</button><button data-prompt="Give me creative ideas">Creative ideas</button></div>';
 messages.appendChild(w);
}

/* CHAT SEARCH */
function renderChatList(){
 const list=$('chatList');
 list.innerHTML='';

 const query=$('chatSearch').value.trim().toLowerCase();

 const filteredChats=chats.filter(chat=>{
  if(!query)return true;

  const title=(chat.title||'New chat').toLowerCase();
  const content=(chat.items||[]).map(item=>
   (item.text||'')+' '+(item.fileName||'')
  ).join(' ').toLowerCase();

  return title.includes(query)||content.includes(query);
 });

 if(!filteredChats.length){
  const empty=document.createElement('div');
  empty.className='no-results';
  empty.textContent=query?'No conversations found. Try another word.':'No conversations yet.';
  list.appendChild(empty);
  return;
 }

 filteredChats.forEach(chat=>{
  const row=document.createElement('div');
  row.className='chatrow';

  const el=document.createElement('div');
  el.className='chatitem'+(currentChat&&chat.id===currentChat.id?' active':'');
  el.textContent=chat.title||'New chat';
  el.title=chat.title||'New chat';
  el.onclick=()=>{
   currentChat=chat;
   saveChats();
   renderMessages();
   renderChatList();
   closeSidebar();
  };

  const more=document.createElement('button');
  more.className='chatmore';
  more.textContent='⋮';
  more.title='Chat options';
  more.onclick=e=>{
   e.stopPropagation();
   openChatActions(chat.id,e.currentTarget);
  };

  row.append(el,more);
  list.appendChild(row);
 });
}

$('chatSearch').addEventListener('input',renderChatList);

function renderMessages(){
 closeMessageMenu();
 messages.innerHTML='';
 if(!currentChat||!currentChat.items.length){showWelcome();return}
 currentChat.items.forEach((item,index)=>addMessageElement(item,index));
 messages.scrollTop=messages.scrollHeight;
}

function escapeHTML(s){
 return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function inlineMarkdown(s){
 let x=escapeHTML(s);
 x=x.replace(/`([^`]+)`/g,'<code>$1</code>');
 x=x.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
 x=x.replace(/__(.+?)__/g,'<strong>$1</strong>');
 x=x.replace(/\*(.+?)\*/g,'<em>$1</em>');
 x=x.replace(/_(.+?)_/g,'<em>$1</em>');
 x=x.replace(/~~(.+?)~~/g,'<del>$1</del>');
 x=x.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,(_,label,url)=>'<a href="'+url+'" target="_blank" rel="noopener noreferrer">'+label+'</a>');
 return x;
}

function renderMarkdown(source){
 const lines=String(source).replace(/\r/g,'').split('\n');
 let out='',paragraph=[],listType='',listItems=[],code=false,codeLines=[],lang='';

 function flushP(){
  if(paragraph.length){out+='<p>'+paragraph.map(inlineMarkdown).join('<br>')+'</p>';paragraph=[]}
 }
 function flushList(){
  if(listItems.length){
   out+='<'+listType+'>'+listItems.map(x=>'<li>'+inlineMarkdown(x)+'</li>').join('')+'</'+listType+'>';
   listItems=[];listType='';
  }
 }
 function flushCode(){
  out+='<div class="codebox"><div class="codehead"><span>'+escapeHTML(lang||'Code')+'</span><button type="button" class="copycode">Copy code</button></div><pre><code>'+escapeHTML(codeLines.join('\n'))+'</code></pre></div>';
  codeLines=[];lang='';
 }

 for(let i=0;i<lines.length;i++){
  const line=lines[i];
  if(line.trim().startsWith('```')){
   if(!code){flushP();flushList();code=true;lang=line.trim().slice(3).trim()}
   else{code=false;flushCode()}
   continue;
  }
  if(code){codeLines.push(line);continue}
  if(!line.trim()){flushP();flushList();continue}
  const heading=line.match(/^(#{1,3})\s+(.+)$/);
  if(heading){flushP();flushList();let n=heading[1].length;out+='<h'+n+'>'+inlineMarkdown(heading[2])+'</h'+n+'>';continue}
  if(/^[-*_]{3,}$/.test(line.trim())){flushP();flushList();out+='<hr>';continue}
  const quote=line.match(/^>\s?(.*)$/);
  if(quote){flushP();flushList();out+='<blockquote>'+inlineMarkdown(quote[1])+'</blockquote>';continue}
  const ul=line.match(/^\s*[-*+]\s+(.+)$/);
  const ol=line.match(/^\s*\d+\.\s+(.+)$/);
  if(ul||ol){
   flushP();let type=ul?'ul':'ol';
   if(listType&&listType!==type)flushList();
   listType=type;listItems.push((ul||ol)[1]);continue;
  }
  if(line.includes('|')&&i+1<lines.length&&/^\s*\|?[\s:-]+\|[\s|:-]*$/.test(lines[i+1])){
   flushP();flushList();
   const cells=s=>s.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(v=>v.trim());
   const headers=cells(line);i++;
   out+='<table><thead><tr>'+headers.map(v=>'<th>'+inlineMarkdown(v)+'</th>').join('')+'</tr></thead><tbody>';
   while(i+1<lines.length&&lines[i+1].includes('|')){
    i++;out+='<tr>'+cells(lines[i]).map(v=>'<td>'+inlineMarkdown(v)+'</td>').join('')+'</tr>';
   }
   out+='</tbody></table>';continue;
  }
  flushList();paragraph.push(line);
 }
 flushP();flushList();if(code)flushCode();
 return out;
}

function addMessageElement(item,index){
 const row=document.createElement('div');
 row.className='message '+item.role;
 row.dataset.index=index;
 const avatar=document.createElement('div');
 avatar.className='avatar';
 avatar.textContent=item.role==='user'?'You':'N';
 const body=document.createElement('div');
 const bubble=document.createElement('div');
 bubble.className='bubble';
 const content=document.createElement('div');
 content.className='message-content';
 if(item.role==='assistant')content.innerHTML=renderMarkdown(item.text);
 else content.textContent=item.text;
 if(item.fileName){
  const f=document.createElement('div');
  f.style.marginTop='8px';
  f.textContent='📎 '+item.fileName;
  content.appendChild(f);
 }
 bubble.appendChild(content);
 body.appendChild(bubble);
 row.append(avatar,body);
 messages.appendChild(row);
}

function addMessage(role,text,fileName){
 const item={role,text,fileName:fileName||''};
 currentChat.items.push(item);
 addMessageElement(item,currentChat.items.length-1);
 saveChats();
 messages.scrollTop=messages.scrollHeight;
}

function updateTitle(){
 if(currentChat&&currentChat.title==='New chat'){
  const first=currentChat.items.find(x=>x.role==='user');
  if(first){
   currentChat.title=first.text.slice(0,32)||'New chat';
   renderChatList();saveChats();
  }
 }
}

function showThinking(){
 const row=document.createElement('div');
 row.className='message assistant';
 row.id='thinkingRow';
 row.innerHTML='<div class="avatar">N</div><div class="bubble"><div class="thinking">NOVA is thinking <span class="dots"><span>●</span> <span>●</span> <span>●</span></span></div></div>';
 messages.appendChild(row);
 messages.scrollTop=messages.scrollHeight;
}

function demoReply(userText){
 return "Thanks for your message! I have received: **"+userText.slice(0,180)+"**\n\nNOVA AI is currently in demonstration mode. It needs a real AI connection before it can understand questions and generate natural answers.";
}

function sendMessage(textOverride){
 const text=(textOverride!==undefined?textOverride:input.value).trim();
 if((!text&&!attachment)||thinking)return;
 if(!currentChat)newChat();
 const file=attachment;
 const fileName=file?file.name:'';
 addMessage('user',text,fileName);
 input.value='';
 input.style.height='auto';
 attachment=null;
 $('preview').style.display='none';
 updateTitle();
 thinking=true;
 showThinking();
 setTimeout(()=>{
  const t=$('thinkingRow');
  if(t)t.remove();
  addMessage('assistant',demoReply(text||'your attachment'));
  thinking=false;saveChats();
 },1000);
}

function showToast(message){
 $('toast').textContent=message;
 $('toast').style.display='block';
 clearTimeout(toastTimer);
 toastTimer=setTimeout(()=>$('toast').style.display='none',1600);
}

async function copyText(text){
 try{await navigator.clipboard.writeText(text)}
 catch(e){
  const ta=document.createElement('textarea');
  ta.value=text;document.body.appendChild(ta);ta.select();
  document.execCommand('copy');ta.remove();
 }
 showToast('Copied to clipboard');
}

function downloadText(filename,text){
 const blob=new Blob([text],{type:'text/plain;charset=utf-8'});
 const url=URL.createObjectURL(blob);
 const a=document.createElement('a');
 a.href=url;a.download=filename;
 document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function exportChat(chat){
 if(!chat)return;
 const content=(chat.title||'NOVA Chat')+'\n\n'+chat.items.map(item=>
  (item.role==='user'?'YOU':'NOVA AI')+':\n'+item.text+
  (item.fileName?'\nAttachment: '+item.fileName:'')
 ).join('\n\n--------------------\n\n');
 downloadText((chat.title||'nova-chat').replace(/[^\w-]+/g,'_')+'.txt',content);
 showToast('Chat exported');
}

function exportAllChats(){
 if(!chats.length){showToast('There are no chats to export');return}
 const content=chats.map(chat=>
  'CHAT: '+(chat.title||'New chat')+'\n\n'+chat.items.map(item=>
   (item.role==='user'?'YOU':'NOVA AI')+':\n'+item.text+
   (item.fileName?'\nAttachment: '+item.fileName:'')
  ).join('\n\n')
 ).join('\n\n==============================\n\n');
 downloadText('NOVA-AI-All-Chats.txt',content);
 showToast('All chats exported');
}

/* CHAT OPTIONS: RENAME, EXPORT AND DELETE */
function closeChatActions(){
 $('chatActions').classList.remove('show');
 selectedChatId=null;
}

function openChatActions(chatId,button){
 closeChatActions();
 selectedChatId=chatId;
 const menu=$('chatActions');
 menu.innerHTML='';

 const options=[
  ['rename','✏️ Rename chat'],
  ['export','📤 Export chat'],
  ['delete','🗑️ Delete chat']
 ];

 options.forEach(([action,label])=>{
  const b=document.createElement('button');
  b.textContent=label;
  b.dataset.action=action;
  menu.appendChild(b);
 });

 menu.classList.add('show');
 const rect=button.getBoundingClientRect();
 const w=menu.offsetWidth,h=menu.offsetHeight;
 let left=Math.min(rect.left,innerWidth-w-8);
 let top=Math.min(rect.bottom,innerHeight-h-8);
 menu.style.left=Math.max(8,left)+'px';
 menu.style.top=Math.max(8,top)+'px';
}

function performChatAction(action){
 const chat=chats.find(c=>String(c.id)===String(selectedChatId));
 closeChatActions();
 if(!chat)return;

 if(action==='rename'){
  const name=prompt('Enter a new name for this chat:',chat.title||'New chat');
  if(name===null)return;
  const clean=name.trim();
  if(!clean){showToast('Chat name cannot be empty');return}
  chat.title=clean.slice(0,70);
  saveChats();renderChatList();showToast('Chat renamed');
 }

 if(action==='export')exportChat(chat);

 if(action==='delete'){
  if(!confirm('Delete "'+(chat.title||'New chat')+'"? This cannot be undone.'))return;
  chats=chats.filter(c=>String(c.id)!==String(chat.id));
  if(currentChat&&String(currentChat.id)===String(chat.id)){
   currentChat=chats[0]||null;
  }
  if(!currentChat)newChat();
  else{saveChats();renderChatList();renderMessages()}
  showToast('Chat deleted');
 }
}

$('chatActions').addEventListener('click',e=>{
 const b=e.target.closest('[data-action]');
 if(b)performChatAction(b.dataset.action);
});

$('exportAll').onclick=exportAllChats;

$('clearAll').onclick=()=>{
 if(!chats.length){showToast('There are no chats to clear');return}
 if(!confirm('Delete ALL your saved conversations? This cannot be undone.'))return;
 chats=[];
 currentChat=null;
 saveChats();
 newChat();
 showToast('All chats cleared');
};

function closeMessageMenu(){
 $('messageMenu').classList.remove('show');
 menuIndex=null;
}

function openMessageMenu(row,x,y){
 if(!row||!currentChat)return;
 closeMessageMenu();
 menuIndex=Number(row.dataset.index);
 const item=currentChat.items[menuIndex];
 const menu=$('messageMenu');
 menu.innerHTML='';
 const options=item.role==='user'?
 [['copy','📋 Copy'],['edit','✏️ Edit message']]:
 [['copy','📋 Copy'],['regenerate','🔄 Regenerate'],['like','👍 Good response'],['dislike','👎 Poor response']];
 options.forEach(([action,label])=>{
  const b=document.createElement('button');
  b.type='button';b.textContent=label;b.dataset.action=action;
  menu.appendChild(b);
 });
 menu.classList.add('show');
 const w=menu.offsetWidth,h=menu.offsetHeight;
 menu.style.left=Math.max(8,Math.min(x,innerWidth-w-8))+'px';
 menu.style.top=Math.max(8,Math.min(y,innerHeight-h-8))+'px';
}

function performMenuAction(action){
 if(menuIndex===null||!currentChat)return;
 const index=menuIndex;
 const item=currentChat.items[index];
 closeMessageMenu();
 if(action==='copy'){copyText(item.text);return}
 if(action==='edit'&&item.role==='user'){
  input.value=item.text;input.focus();
  currentChat.items.splice(index);
  saveChats();renderMessages();return;
 }
 if(action==='like'||action==='dislike'){
  item.feedback=action;saveChats();return;
 }
 if(action==='regenerate'&&item.role==='assistant'){
  if(thinking)return;
  currentChat.items.splice(index);
  saveChats();renderMessages();
  thinking=true;showThinking();
  setTimeout(()=>{
   const t=$('thinkingRow');if(t)t.remove();
   const previous=[...currentChat.items].reverse().find(x=>x.role==='user');
   addMessage('assistant',demoReply(previous?previous.text:'your message'));
   thinking=false;saveChats();
  },1000);
 }
}

let startX=0,startY=0;
messages.addEventListener('pointerdown',e=>{
 const row=e.target.closest('.message');
 if(!row||e.target.closest('button')||e.pointerType==='mouse')return;
 startX=e.clientX;startY=e.clientY;
 clearTimeout(holdTimer);
 holdTimer=setTimeout(()=>openMessageMenu(row,startX,startY),600);
});
messages.addEventListener('pointermove',e=>{
 if(Math.abs(e.clientX-startX)>12||Math.abs(e.clientY-startY)>12)clearTimeout(holdTimer);
});
['pointerup','pointercancel','pointerleave'].forEach(ev=>
 messages.addEventListener(ev,()=>clearTimeout(holdTimer))
);
messages.addEventListener('contextmenu',e=>{
 const row=e.target.closest('.message');
 if(!row)return;
 e.preventDefault();openMessageMenu(row,e.clientX,e.clientY);
});
$('messageMenu').addEventListener('click',e=>{
 const b=e.target.closest('[data-action]');
 if(b)performMenuAction(b.dataset.action);
});
document.addEventListener('click',e=>{
 if(!e.target.closest('#messageMenu')&&!e.target.closest('.message'))closeMessageMenu();
 if(!e.target.closest('#chatActions')&&!e.target.closest('.chatmore'))closeChatActions();
});
messages.addEventListener('click',async e=>{
 const b=e.target.closest('.copycode');
 if(b){
  await copyText(b.closest('.codebox').querySelector('code').textContent);
  b.textContent='Copied!';
 }
});

$('sendBtn').onclick=()=>sendMessage();
input.addEventListener('keydown',e=>{
 if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}
});
input.addEventListener('input',()=>{
 input.style.height='auto';
 input.style.height=Math.min(input.scrollHeight,150)+'px';
});
$('newChat').onclick=newChat;
$('menuBtn').onclick=()=>{
 $('sidebar').classList.toggle('open');
 $('overlay').classList.toggle('show');
};
$('overlay').onclick=closeSidebar;
function closeSidebar(){
 $('sidebar').classList.remove('open');
 $('overlay').classList.remove('show');
}

$('attachBtn').onclick=()=>$('attachMenu').classList.toggle('show');
$('cameraBtn').onclick=()=>{$('attachMenu').classList.remove('show');$('cameraInput').click()};
$('photoBtn').onclick=()=>{$('attachMenu').classList.remove('show');$('photoInput').click()};
$('fileBtn').onclick=()=>{$('attachMenu').classList.remove('show');$('fileInput').click()};

function setAttachment(file){
 if(!file)return;
 attachment=file;
 const preview=$('preview');
 preview.style.display='block';
 preview.innerHTML='';
 if(file.type.startsWith('image/')){
  const img=document.createElement('img');
  img.src=URL.createObjectURL(file);
  preview.appendChild(img);
 }
 preview.appendChild(document.createTextNode('📎 '+file.name+' — ready. Press Send when you want to attach it.'));
}
['cameraInput','photoInput','fileInput'].forEach(id=>
 $(id).addEventListener('change',e=>setAttachment(e.target.files[0]))
);

document.addEventListener('click',e=>{
 const prompt=e.target.closest('[data-prompt]');
 if(prompt)sendMessage(prompt.dataset.prompt);
});

$('micBtn').onclick=()=>{
 const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SpeechRecognition){showToast('Voice typing is not supported in this browser');return}
 const rec=new SpeechRecognition();
 rec.lang='en-US';rec.interimResults=false;
 rec.onresult=e=>{input.value+=(input.value?' ':'')+e.results[0][0].transcript};
 rec.onerror=()=>showToast('Microphone unavailable. Check browser permission.');
 rec.start();
};

/* RESTORE SAVED CHATS */
if(loadChats()){
 renderChatList();
 renderMessages();
}else{
 newChat();
}
</script>
</body>
</html>
