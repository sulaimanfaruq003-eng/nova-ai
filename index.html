
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080e1d">
<title>NOVA AI</title>
<style>
:root{--bg:#080e1d;--panel:#101a2d;--panel2:#17243a;--text:#f3f6ff;--muted:#93a2bb;--blue:#3985ff;--border:#25334b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}
button,textarea{font:inherit}
button{cursor:pointer}
.app{display:flex;height:100dvh;overflow:hidden}
.sidebar{width:270px;background:#0b1425;border-right:1px solid var(--border);padding:17px;display:flex;flex-direction:column;flex-shrink:0;transition:transform .25s;z-index:20}
.brand{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:800;margin:5px 0 25px}
.logo{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#1677ff,#64c4ff);display:grid;place-items:center;color:white;font-size:22px;font-weight:900}
.newchat{background:var(--blue);border:0;color:white;padding:13px;border-radius:12px;font-weight:700}
.sideheading{font-size:12px;color:var(--muted);margin:25px 5px 10px}
.chatlist{overflow:auto;flex:1}
.chatitem{padding:11px;border-radius:9px;color:#cbd6e9;cursor:pointer;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chatitem:hover,.chatitem.active{background:var(--panel2)}
.sidebottom{border-top:1px solid var(--border);padding-top:12px;color:var(--muted);font-size:13px}
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.topbar{height:60px;display:flex;align-items:center;padding:0 17px;border-bottom:1px solid var(--border);gap:13px}
.menu{background:none;border:0;color:white;font-size:23px}
.topname{font-weight:700}
.status{margin-left:auto;color:#7e9bc4;font-size:12px}
.messages{flex:1;overflow-y:auto;padding:25px 18px 30px}
.welcome{max-width:720px;margin:13vh auto 0;text-align:center}
.welcome h1{font-size:32px;margin-bottom:10px}
.welcome p{color:var(--muted)}
.suggestions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:28px}
.suggestions button{background:var(--panel);border:1px solid var(--border);color:#dce7fb;padding:11px 14px;border-radius:12px}
.message{max-width:850px;margin:0 auto 25px;display:flex;gap:12px;align-items:flex-start}
.message.user{flex-direction:row-reverse}
.avatar{width:31px;height:31px;border-radius:10px;background:var(--panel2);display:grid;place-items:center;flex-shrink:0;font-size:14px}
.message.assistant .avatar{background:#174b9a}
.bubble{max-width:min(100%,720px);padding:13px 16px;border-radius:15px;background:var(--panel);line-height:1.65;overflow-wrap:anywhere}
.message.user .bubble{background:#173c70}
.message-content p{margin:0 0 12px}
.message-content p:last-child{margin-bottom:0}
.message-content h1,.message-content h2,.message-content h3{line-height:1.3;margin:18px 0 9px}
.message-content h1{font-size:1.5em}
.message-content h2{font-size:1.3em}
.message-content h3{font-size:1.12em}
.message-content ul,.message-content ol{padding-left:24px}
.message-content li{margin:5px 0}
.message-content blockquote{border-left:3px solid var(--blue);margin:12px 0;padding:5px 12px;color:#bdcce3}
.message-content a{color:#79b4ff}
.message-content code{background:#081120;padding:2px 5px;border-radius:5px;font-size:.9em}
.codebox{background:#070d18;border:1px solid var(--border);border-radius:10px;margin:12px 0;overflow:hidden}
.codehead{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;color:var(--muted);font-size:12px;border-bottom:1px solid var(--border)}
.codehead button{background:#1b2a42;border:0;color:white;padding:5px 9px;border-radius:6px}
.codebox pre{padding:13px;margin:0;overflow-x:auto;white-space:pre}
.message-content table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.message-content th,.message-content td{border:1px solid #34435b;padding:8px;text-align:left}
.message-content th{background:#1b2a42}
.actions{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}
.actions button{background:transparent;border:0;color:var(--muted);padding:5px 7px;border-radius:6px;font-size:12px}
.actions button:hover{background:var(--panel2);color:white}
.thinking{color:#9bb9e8;font-size:13px;display:flex;gap:8px;align-items:center}
.dots span{animation:blink 1.2s infinite;opacity:.2}
.dots span:nth-child(2){animation-delay:.2s}
.dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:1}}
.composer-area{padding:12px 16px 18px;background:linear-gradient(transparent,var(--bg) 20%)}
.composer{max-width:850px;margin:auto;background:var(--panel);border:1px solid #34445f;border-radius:17px;padding:10px;display:flex;align-items:flex-end;gap:8px}
.composer textarea{flex:1;resize:none;max-height:150px;min-height:40px;background:transparent;border:0;outline:0;color:white;padding:10px}
.toolbtn{background:var(--panel2);border:0;color:white;border-radius:10px;padding:10px;font-size:18px}
.sendbtn{background:var(--blue);border:0;color:white;border-radius:10px;padding:11px 15px;font-weight:700}
.disclaimer{text-align:center;color:#71829c;font-size:11px;margin-top:9px}
.attachmenu{display:none;position:absolute;bottom:95px;left:18px;background:#17243a;border:1px solid var(--border);padding:7px;border-radius:12px;z-index:30;box-shadow:0 8px 30px #0008}
.attachmenu.show{display:grid;gap:5px}
.attachmenu button{background:none;border:0;color:white;text-align:left;padding:11px;border-radius:8px}
.attachmenu button:hover{background:#263956}
.preview{max-width:850px;margin:0 auto 8px;display:none;background:var(--panel);padding:9px;border-radius:10px;color:#cbd6e9;font-size:13px}
.preview img{max-width:90px;max-height:75px;object-fit:cover;border-radius:7px;vertical-align:middle;margin-right:8px}
.overlay{display:none}
@media(max-width:700px){
.sidebar{position:absolute;top:0;bottom:0;left:0;transform:translateX(-105%);box-shadow:10px 0 30px #0008}
.sidebar.open{transform:translateX(0)}
.overlay.show{display:block;position:absolute;inset:0;background:#0008;z-index:15}
.messages{padding:20px 12px}
.welcome{margin-top:12vh}
.welcome h1{font-size:27px}
.composer-area{padding:9px 10px 13px}
}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
 <div class="brand"><div class="logo">N</div>NOVA AI</div>
 <button class="newchat" id="newChat">＋ New Chat</button>
 <div class="sideheading">RECENT CHATS</div>
 <div class="chatlist" id="chatList"></div>
 <div class="sidebottom">NOVA AI · Your AI. Your World.</div>
</aside>
<div class="overlay" id="overlay"></div>
<main class="main">
 <header class="topbar">
  <button class="menu" id="menuBtn">☰</button>
  <div class="topname">NOVA AI</div>
  <div class="status">Demo mode</div>
 </header>
 <section class="messages" id="messages">
  <div class="welcome" id="welcome">
   <div class="logo" style="margin:auto;width:55px;height:55px;font-size:30px">N</div>
   <h1>What can I help you with?</h1>
   <p>Your AI. Your World.</p>
   <div class="suggestions">
    <button data-prompt="Explain something in a simple way">Explain something</button>
    <button data-prompt="Help me write something">Help me write</button>
    <button data-prompt="Give me creative ideas">Creative ideas</button>
   </div>
  </div>
 </section>
 <div class="composer-area">
  <div class="preview" id="preview"></div>
  <div class="composer">
   <button class="toolbtn" id="attachBtn" title="Attach">＋</button>
   <textarea id="input" rows="1" placeholder="Message NOVA AI..."></textarea>
   <button class="toolbtn" id="micBtn" title="Voice typing">🎙</button>
   <button class="sendbtn" id="sendBtn">Send</button>
  </div>
  <div class="disclaimer">NOVA AI can make mistakes. Check important information.</div>
 </div>
 <div class="attachmenu" id="attachMenu">
  <button id="cameraBtn">📷 Camera</button>
  <button id="photoBtn">🖼 Photos</button>
  <button id="fileBtn">📁 Files</button>
 </div>
</main>
</div>
<input hidden type="file" id="cameraInput" accept="image/*" capture="environment">
<input hidden type="file" id="photoInput" accept="image/*">
<input hidden type="file" id="fileInput" accept="image/*,.pdf,.doc,.docx,.txt,.csv,.xls,.xlsx,.ppt,.pptx">

<script>
const $=id=>document.getElementById(id);
const messages=$('messages'),input=$('input');
let chats=[],currentChat=null,attachment=null,thinking=false;

function newChat(){
 currentChat={id:Date.now(),title:'New chat',items:[]};
 chats.unshift(currentChat);
 renderChatList();
 showWelcome();
 closeSidebar();
}
function showWelcome(){
 messages.innerHTML='';
 const w=document.createElement('div');
 w.className='welcome';w.id='welcome';
 w.innerHTML='<div class="logo" style="margin:auto;width:55px;height:55px;font-size:30px">N</div><h1>What can I help you with?</h1><p>Your AI. Your World.</p><div class="suggestions"><button data-prompt="Explain something in a simple way">Explain something</button><button data-prompt="Help me write something">Help me write</button><button data-prompt="Give me creative ideas">Creative ideas</button></div>';
 messages.appendChild(w);
}
function renderChatList(){
 $('chatList').innerHTML='';
 chats.forEach(chat=>{
  const el=document.createElement('div');
  el.className='chatitem'+(currentChat&&chat.id===currentChat.id?' active':'');
  el.textContent=chat.title;
  el.onclick=()=>{currentChat=chat;renderMessages();renderChatList();closeSidebar()};
  $('chatList').appendChild(el);
 });
}
function renderMessages(){
 messages.innerHTML='';
 if(!currentChat||!currentChat.items.length){showWelcome();return}
 currentChat.items.forEach((item,index)=>addMessageElement(item,index));
 messages.scrollTop=messages.scrollHeight;
}
function escapeHTML(s){
 return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function inlineMarkdown(s){
 let x=escapeHTML(s);
 x=x.replace(/`([^`]+)`/g,'<code>$1</code>');
 x=x.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
 x=x.replace(/__(.+?)__/g,'<strong>$1</strong>');
 x=x.replace(/\*(.+?)\*/g,'<em>$1</em>');
 x=x.replace(/_(.+?)_/g,'<em>$1</em>');
 x=x.replace(/~~(.+?)~~/g,'<del>$1</del>');
 x=x.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,(_,label,url)=>'<a href="'+url+'" target="_blank" rel="noopener noreferrer">'+label+'</a>');
 x=x.replace(/(^|[\s>])(https?:\/\/[^\s<]+)/g,'$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>');
 return x;
}
function renderMarkdown(source){
 const lines=String(source).replace(/\r/g,'').split('\n');
 let out='',paragraph=[],listType='',listItems=[],code=false,codeLines=[],lang='';
 function flushP(){if(paragraph.length){out+='<p>'+paragraph.map(inlineMarkdown).join('<br>')+'</p>';paragraph=[]}}
 function flushList(){if(listItems.length){out+='<'+listType+'>'+listItems.map(x=>'<li>'+inlineMarkdown(x)+'</li>').join('')+'</'+listType+'>';listItems=[];listType=''}}
 function flushCode(){
  const codeText=codeLines.join('\n');
  out+='<div class="codebox"><div class="codehead"><span>'+escapeHTML(lang||'Code')+'</span><button type="button" class="copycode">Copy code</button></div><pre><code>'+escapeHTML(codeText)+'</code></pre></div>';
  codeLines=[];lang='';
 }
 for(let i=0;i<lines.length;i++){
  const line=lines[i];
  if(line.trim().startsWith('```')){
   if(!code){flushP();flushList();code=true;lang=line.trim().slice(3).trim()}
   else{code=false;flushCode()}
   continue;
  }
  if(code){codeLines.push(line);continue}
  if(!line.trim()){flushP();flushList();continue}
  const heading=line.match(/^(#{1,3})\s+(.+)$/);
  if(heading){flushP();flushList();const n=heading[1].length;out+='<h'+n+'>'+inlineMarkdown(heading[2])+'</h'+n+'>';continue}
  if(/^[-*_]{3,}$/.test(line.trim())){flushP();flushList();out+='<hr>';continue}
  const quote=line.match(/^>\s?(.*)$/);
  if(quote){flushP();flushList();out+='<blockquote>'+inlineMarkdown(quote[1])+'</blockquote>';continue}
  const ul=line.match(/^\s*[-*+]\s+(.+)$/);
  const ol=line.match(/^\s*\d+\.\s+(.+)$/);
  if(ul||ol){
   flushP();const type=ul?'ul':'ol';
   if(listType&&listType!==type)flushList();
   listType=type;listItems.push((ul||ol)[1]);continue;
  }
  flushList();paragraph.push(line);
 }
 flushP();flushList();if(code)flushCode();
 return out;
}
function addMessageElement(item,index){
 const row=document.createElement('div');
 row.className='message '+item.role;
 const avatar=document.createElement('div');
 avatar.className='avatar';avatar.textContent=item.role==='user'?'You':'N';
 const body=document.createElement('div');
 const bubble=document.createElement('div');bubble.className='bubble';
 const content=document.createElement('div');content.className='message-content';
 if(item.role==='assistant')content.innerHTML=renderMarkdown(item.text);
 else content.textContent=item.text;
 if(item.fileName){
  const f=document.createElement('div');f.style.marginTop='8px';f.textContent='📎 '+item.fileName;
  content.appendChild(f);
 }
 bubble.appendChild(content);body.appendChild(bubble);
 if(item.role==='assistant'){
  const actions=document.createElement('div');actions.className='actions';
  actions.innerHTML='<button data-action="copy">Copy</button><button data-action="regenerate">Regenerate</button><button data-action="like">👍</button><button data-action="dislike">👎</button>';
  body.appendChild(actions);
 }else{
  const actions=document.createElement('div');actions.className='actions';
  actions.innerHTML='<button data-action="edit">Edit</button><button data-action="copy">Copy</button>';
  body.appendChild(actions);
 }
 row.append(avatar,body);messages.appendChild(row);
}
function addMessage(role,text,fileName){
 const item={role,text,fileName:fileName||''};
 currentChat.items.push(item);
 addMessageElement(item,currentChat.items.length-1);
 messages.scrollTop=messages.scrollHeight;
}
function renderChatListTitle(){
 if(currentChat&&currentChat.title==='New chat'){
  const first=currentChat.items.find(x=>x.role==='user');
  if(first){currentChat.title=first.text.slice(0, thirty=32)||'New chat';renderChatList()}
 }
}
function showThinking(){
 const row=document.createElement('div');row.className='message assistant';row.id='thinkingRow';
 row.innerHTML='<div class="avatar">N</div><div class="bubble"><div class="thinking">NOVA is thinking <span class="dots"><span>●</span> <span>●</span> <span>●</span></span></div></div>';
 messages.appendChild(row);messages.scrollTop=messages.scrollHeight;
}
function demoReply(){
 return "I'm NOVA AI, and this is currently my demo mode. ✨\n\nMy chat interface is working, but my real AI connection has not been activated yet.\n\n**What we're building next:**\n- Natural AI conversations\n- Web search and citations\n- Voice and file understanding\n\nYour messages are not being sent to an AI service yet.";
}
function sendMessage(textOverride){
 const text=(textOverride!==undefined?textOverride:input.value).trim();
 if((!text&&!attachment)||thinking)return;
 if(!currentChat)newChat();
 const file=attachment;
 const fileName=file?file.name:'';
 addMessage('user',text,fileName);
 input.value='';input.style.height='auto';
 attachment=null;$('preview').style.display='none';
 renderChatListTitle();thinking=true;
 showThinking();
 setTimeout(()=>{
  const t=$('thinkingRow');if(t)t.remove();
  const reply=demoReply();
  addMessage('assistant',reply);
  currentChat.items.push(); // no-op
  thinking=false;
 },1200);
}
$('sendBtn').onclick=()=>sendMessage();
input.addEventListener('keydown',e=>{
 if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}
});
input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,150)+'px'});
$('newChat').onclick=newChat;
$('menuBtn').onclick=()=>{$('sidebar').classList.toggle('open');$('overlay').classList.toggle('show')};
$('overlay').onclick=closeSidebar;
function closeSidebar(){$('sidebar').classList.remove('open');$('overlay').classList.remove('show')}
$('attachBtn').onclick=()=> $('attachMenu').classList.toggle('show');
$('cameraBtn').onclick=()=>{$('attachMenu').classList.remove('show');$('cameraInput').click()};
$('photoBtn').onclick=()=>{$('attachMenu').classList.remove('show');$('photoInput').click()};
$('fileBtn').onclick=()=>{$('attachMenu').classList.remove('show');$('fileInput').click()};
function setAttachment(file){
 if(!file)return;
 attachment=file;
 const preview=$('preview');preview.style.display='block';preview.innerHTML='';
 if(file.type.startsWith('image/')){
  const img=document.createElement('img');img.src=URL.createObjectURL(file);preview.appendChild(img);
 }
 preview.appendChild(document.createTextNode('📎 '+file.name+' — ready to attach. Press Send when ready.'));
}
['cameraInput','photoInput','fileInput'].forEach(id=>$(id).addEventListener('change',e=>setAttachment(e.target.files[0])));
messages.addEventListener('click',async e=>{
 const codeBtn=e.target.closest('.copycode');
 if(codeBtn){
  const code=codeBtn.closest('.codebox').querySelector('code').textContent;
  await copyText(code);codeBtn.textContent='Copied!';return;
 }
 const btn=e.target.closest('[data-action]');if(!btn)return;
 const row=btn.closest('.message');const rows=[...messages.querySelectorAll('.message')];
 const rowIndex=rows.indexOf(row);const item=currentChat.items[rowIndex];
 const action=btn.dataset.action;
 if(action==='copy')await copyText(item.text);
 if(action==='like'||action==='dislike'){btn.textContent=action==='like'?'👍 Thanks':'👎 Thanks'}
 if(action==='edit'){
  input.value=item.text;input.focus();
  currentChat.items.splice(rowIndex,1);renderMessages();
 }
 if(action==='regenerate'){
  if(thinking)return;
  const next=currentChat.items[rowIndex+1];
  if(next&&next.role==='assistant')currentChat.items.splice(rowIndex+1,1);
  renderMessages();thinking=true;showThinking();
  setTimeout(()=>{const t=$('thinkingRow');if(t)t.remove();addMessage('assistant',demoReply());thinking=false},1200);
 }
});
async function copyText(text){
 try{await navigator.clipboard.writeText(text)}
 catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}
}
document.addEventListener('click',e=>{
 const prompt=e.target.closest('[data-prompt]');
 if(prompt)sendMessage(prompt.dataset.prompt);
});
$('micBtn').onclick=()=>{
 const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SpeechRecognition){alert('Voice typing is not supported by this browser.');return}
 const rec=new SpeechRecognition();rec.lang='en-US';rec.interimResults=false;
 rec.onresult=e=>{input.value+=(input.value?' ':'')+e.results[0][0].transcript};
 rec.onerror=()=>alert('Microphone unavailable. Check browser microphone permission.');
 rec.start();
};
newChat();
</script>
</body>
</html>
